name: 분류 오류 사례
description: Clef-flash가 메모를 기대와 다른 칸으로 분류한 사례를 기록합니다.
title: "[분류 오류] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        분류가 틀렸거나 애매했던 메모를 한 건씩 기록합니다. 개선 방향은 #2에서 검토합니다.
  - type: textarea
    id: memo
    attributes:
      label: 메모
      description: 분류한 메모 원문을 그대로 붙여 넣습니다.
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: 분류 결과
      description: Clef-flash가 고른 칸입니다.
      options:
        - 할 일 (todo)
        - 아이디어 (idea)
        - 확인할 것 (check)
        - 참고 (reference)
  - type: dropdown
    id: expected
    attributes:
      label: 기대 칸
      description: 이 메모가 들어가야 한다고 보는 칸입니다.
      options:
        - 할 일 (todo)
        - 아이디어 (idea)
        - 확인할 것 (check)
        - 참고 (reference)
  - type: textarea
    id: scores
    attributes:
      label: 칸별 확률
      description: 화면에 표시된 값을 적습니다. 화면 값은 반올림한 값입니다.
      value: |
        - 할 일:
        - 아이디어:
        - 확인할 것:
        - 참고:
  - type: textarea
    id: reason
    attributes:
      label: 왜 틀렸다고 보는지
      description: 기대 칸이 맞다고 보는 이유를 적습니다.
