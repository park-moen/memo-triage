services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: memo
      POSTGRES_PASSWORD: memo
      POSTGRES_DB: memo
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memo -d memo"]
      interval: 2s
      timeout: 3s
      retries: 15

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    # server/.env의 CLOUDFLARE_* 값을 넘긴다. 파일이 없어도 뜨고(규칙 분류기로 동작), DATABASE_URL은 아래 environment가 덮어쓴다.
    env_file:
      - path: ./server/.env
        required: false
    environment:
      DATABASE_URL: postgresql://memo:memo@db:5432/memo
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # server 코드 수정은 바로 반영된다. shared·schema.prisma·의존성을 바꾸면 --build로 다시 띄운다.
      - ./server/src:/app/server/src
      - ./server/prisma:/app/server/prisma

volumes:
  db-data:
